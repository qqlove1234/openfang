name: Build OpenFang (cross)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build with cross (static)
        run: cross build --release --target x86_64-unknown-linux-musl --bin openfang

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openfang-musl
          path: target/x86_64-unknown-linux-musl/release/openfang
          retention-days: 7
